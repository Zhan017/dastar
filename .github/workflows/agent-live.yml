name: agent-live

on:
  workflow_dispatch:
    inputs:
      mode:
        description: what to run against the real model
        type: choice
        options: [conversations, probe, judge]
        default: conversations
      part:
        description: the labeled part the judge is measured against (mode judge only)
        type: choice
        options: [dev, held-out]
        default: dev

jobs:
  live:
    # the reference agent against the real model, started by hand; no push or pull request runs it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dastar_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: dastar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dastar_owner -d dastar" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      OWNER_URL: postgres://dastar_owner:owner@localhost:5432/dastar
      APP_URL: postgres://dastar_app:app@localhost:5432/dastar
      DASTAR_VENUE_ID: 0199a000-0000-7000-8000-000000000001
    steps:
      - name: Check the key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "the ANTHROPIC_API_KEY repository secret is not set"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: inputs.mode == 'probe'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @dastar/agent live probe
      - if: inputs.mode == 'judge'
        name: Measure the judge against the labeled part
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PART: ${{ inputs.part }}
        run: pnpm --filter @dastar/agent live judge --part "$PART"
      - if: inputs.mode == 'conversations'
        name: Set up the database and the demo venue
        env:
          DASTAR_APP_PASSWORD: app
        run: |
          pnpm -s migrate --owner-url "$OWNER_URL"
          pnpm -s roles --owner-url "$OWNER_URL"
          pnpm -s seed:demo --owner-url "$OWNER_URL"
      - if: inputs.mode == 'conversations'
        name: Create the agent and demo keys
        shell: bash
        env:
          DATABASE_URL: ${{ env.APP_URL }}
        run: |
          # each key is read into a variable, masked at once, and passed on through GITHUB_ENV; none is printed
          make_key() { # label capabilities key-variable [id-variable]
            local created key
            created=$(pnpm -s --filter @dastar/api keys:create --label "$1" --capabilities "$2" --venues "$DASTAR_VENUE_ID" | jq -Rn '[inputs | fromjson? | select(type == "object" and has("key"))] | last')
            key=$(jq -r '.key // empty' <<<"$created")
            echo "::add-mask::$key"
            [ -n "$key" ] || { echo "no key was created for $1"; return 1; }
            echo "$3=$key" >> "$GITHUB_ENV"
            if [ -n "${4:-}" ]; then
              echo "$4=$(jq -r '.id' <<<"$created")" >> "$GITHUB_ENV"
            fi
          }
          make_key agent read,hold,cancel AGENT_KEY AGENT_KEY_ID
          make_key demo read,confirm DEMO_CONFIRM_KEY
      - if: inputs.mode == 'conversations'
        name: Start the API
        env:
          HOST: 127.0.0.1
          PORT: "8080"
          DATABASE_URL: ${{ env.APP_URL }}
        shell: bash
        run: |
          pnpm --filter @dastar/api start > api.log 2>&1 &
          api_pid=$!
          for _ in $(seq 60); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "the API stopped before it answered /health/ready; the end of api.log:"
              tail -n 50 api.log
              exit 1
            fi
            if curl -fs --max-time 5 http://127.0.0.1:8080/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the API did not answer /health/ready within 60 seconds"
          exit 1
      - if: inputs.mode == 'conversations'
        name: Add the venue's service periods
        shell: bash
        env:
          DATABASE_URL: ${{ env.APP_URL }}
        run: |
          # the admin key is created here, masked at once, and used only in this step: it is never passed on
          created=$(pnpm -s --filter @dastar/api keys:create --label admin --capabilities admin --venues "$DASTAR_VENUE_ID" | jq -Rn '[inputs | fromjson? | select(type == "object" and has("key"))] | last')
          admin_key=$(jq -r '.key // empty' <<<"$created")
          echo "::add-mask::$admin_key"
          [ -n "$admin_key" ] || { echo "no key was created for admin"; exit 1; }
          for day in 1 2 3 4 5 6 7; do
            curl -fsS --max-time 30 -o /dev/null -X POST "http://127.0.0.1:8080/admin/venues/$DASTAR_VENUE_ID/schedules" \
              -H "authorization: Bearer $admin_key" -H "content-type: application/json" \
              -d '{"day_of_week":'"$day"',"opens":"17:00","closes":"23:00","duration_by_size":{"2":90,"4":120,"8":150}}'
          done
      - if: inputs.mode == 'conversations'
        name: Create the key that seals the confirm tokens
        run: |
          token_key=$(openssl rand -base64 32)
          echo "::add-mask::$token_key"
          echo "DASTAR_TOKEN_KEY=$token_key" >> "$GITHUB_ENV"
      - if: inputs.mode == 'conversations'
        name: Run the five conversations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASTAR_URL: http://127.0.0.1:8080
          DATABASE_URL: ${{ env.APP_URL }}
        run: pnpm --filter @dastar/agent live conversations
      - if: inputs.mode == 'conversations'
        name: Serve the agent as documented, chat, confirm and stop it
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASTAR_URL: http://127.0.0.1:8080
          DATABASE_URL: ${{ env.APP_URL }}
          AGENT_PORT: "8081"
        run: |
          # the answer to the chat holds a confirm token: it is read into a variable that is masked at once, never printed,
          # and its file is deleted when the step ends, however it ends
          holds_secret() { grep -qE 'confirm_token|dsk_|sk-ant' agent.log 2>/dev/null; }
          cleanup() {
            local code=$?
            rm -f chat.json confirm.json refused.json
            if [ -n "${agent_pid:-}" ] && kill -0 "$agent_pid" 2>/dev/null; then kill -TERM -- "-$agent_pid" 2>/dev/null || true; fi
            if holds_secret; then
              echo "agent.log holds a confirm token or a key; it is removed and not uploaded"
              rm -f agent.log
              code=1
            fi
            exit "$code"
          }

          # 1. start the agent as the README says, in its own process group
          setsid pnpm --filter @dastar/agent start > agent.log 2>&1 &
          agent_pid=$!
          trap cleanup EXIT

          # 2. wait for it to listen
          listening=
          for _ in $(seq 60); do
            if grep -q '"msg":"listening"' agent.log; then listening=1; break; fi
            if ! kill -0 "$agent_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$listening" ]; then
            echo "the agent did not start listening within 60 seconds; agent.log:"
            cat agent.log
            exit 1
          fi

          # 3. the README's chat request, then the confirm request with the token and no key
          status=$(curl -sS --max-time 180 -o chat.json -w '%{http_code}' -X POST http://127.0.0.1:8081/demo/chat \
            -H "content-type: application/json" \
            -d '{"message":"Please hold a table for 2 on 7 June 2030 at 19:00."}')
          [ "$status" = "200" ] || { echo "the chat answered HTTP $status"; exit 1; }
          token=$(jq -r '.holds[0].confirm_token // empty' chat.json)
          [ -z "$token" ] || echo "::add-mask::$token"
          jq -e '(.session_id | type == "string" and length > 0) and (.reply.message | type == "string" and length > 0) and ((.holds | length) == 1)' chat.json > /dev/null \
            || { echo "the chat answer does not have a session_id, a reply message and exactly one hold"; exit 1; }
          id=$(jq -r '.holds[0].reservation_id' chat.json)
          [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "the hold's reservation_id is not a uuid"; exit 1; }
          [ -n "$token" ] || { echo "the hold has no confirm_token"; exit 1; }
          confirmed=$(T="$token" jq -cn '{confirm_token: env.T}' | curl -sS --max-time 30 -o confirm.json -w '%{http_code}' -X POST "http://127.0.0.1:8080/v1/reservations/$id/confirm" \
            -H "content-type: application/json" --data-binary @-)
          [ "$confirmed" = "200" ] || { echo "the confirm request answered HTTP $confirmed"; exit 1; }
          [ "$(jq -r '.receipt.status' confirm.json)" = "confirmed" ] || { echo "the confirm request did not confirm the reservation"; exit 1; }
          rm -f chat.json confirm.json

          # 4. a malformed request is a 400 Problem Details with the code validation
          refused=$(curl -sS --max-time 30 -o refused.json -w '%{http_code} %{content_type}' -X POST http://127.0.0.1:8081/demo/chat \
            -H "content-type: text/plain" -d x)
          [ "${refused%% *}" = "400" ] || { echo "a malformed chat request answered HTTP ${refused%% *}, not 400"; exit 1; }
          [[ "${refused#* }" == application/problem+json* ]] || { echo "a malformed chat request answered with the content type ${refused#* }"; exit 1; }
          [ "$(jq -r '.code' refused.json)" = "validation" ] || { echo "a malformed chat request answered with the code $(jq -r '.code' refused.json)"; exit 1; }

          # 5. stop it the way a terminal's interrupt does, reaching every process of its group
          kill -TERM -- "-$agent_pid"
          stopped=
          for _ in $(seq 15); do
            if ! curl -s --max-time 2 -o /dev/null http://127.0.0.1:8081/ && ! kill -0 "$agent_pid" 2>/dev/null; then stopped=1; break; fi
            sleep 1
          done
          [ -n "$stopped" ] || { echo "the agent did not stop within 15 seconds of SIGTERM"; exit 1; }
          if grep -q 'shutdown failed' agent.log; then
            echo "the agent logged a failed shutdown:"
            grep 'shutdown failed' agent.log
            exit 1
          fi

          # 6. neither a token nor a key reached the log
          if holds_secret; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-live
          path: |
            apps/agent/agent-live.json
            apps/agent/judge-accuracy.json
            api.log
            agent.log
          if-no-files-found: warn
